<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D28A" />
      <stop offset="100%" stop-color="#B5822C" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#101318" />

  <!-- Bhupur: Outer Square -->
  <rect x="10" y="10" width="44" height="44" rx="2" fill="none" stroke="url(#gold)" stroke-width="3" />

  <!-- Kubera Yantra Hexagram -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.75" stroke-linejoin="round">
    <polygon points="32,17 19,39 45,39" />
    <polygon points="32,47 19,25 45,25" />
  </g>

  <!-- Bindu -->
  <circle cx="32" cy="32" r="3.5" fill="url(#gold)" />
</svg>
